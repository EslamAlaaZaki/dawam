# The bank sample's two source systems, standalone (not part of DAWAM's own Compose
# project). See README.md for the connection details.
#
#   docker compose -f samples/bank/compose.yaml up -d --wait   # start (first start seeds)
#   docker compose -f samples/bank/compose.yaml down           # stop, keep the data
#   docker compose -f samples/bank/compose.yaml down -v        # stop and delete the data
#
# The ports are published on every interface so DAWAM's containers can reach them through
# the host. The passwords are sample values: don't run this on a shared network.

name: dawam-sample-bank

services:
  # Core Banking: PostgreSQL, database `corebank`, Database Schema `banking`.
  corebank-db:
    image: postgres:16
    environment:
      POSTGRES_DB: corebank
      POSTGRES_USER: corebank_admin
      POSTGRES_PASSWORD: corebank_admin
    ports:
      - "5433:5432"
    volumes:
      - ./databases/corebank/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - corebank-data:/var/lib/postgresql/data
    # Over TCP and as the reader, so it only passes once seeding has finished (the
    # first-start seeding runs on a server that listens on a local socket only).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD=dawam_reader psql -h 127.0.0.1 -U dawam_reader -d corebank -tAc
          'SELECT 1 FROM banking.transactions LIMIT 1' | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # CRM: MySQL, database (and Database Schema) `crm`.
  crm-db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: crm_admin
      MYSQL_DATABASE: crm
    ports:
      - "3307:3306"
    volumes:
      - ./databases/crm/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - crm-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql -h 127.0.0.1 -u dawam_reader -pdawam_reader -N
          -e 'SELECT 1 FROM crm.complaints LIMIT 1' 2>/dev/null | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

volumes:
  corebank-data:
  crm-data:
