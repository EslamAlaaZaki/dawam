[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dawam"
version = "0.1.0"
description = "DAWAM: Data Analysis & Warehouse Architecture Modeler"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "oracledb>=2.5",
    "pymssql>=2.3",
    "pymysql>=1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "python-multipart>=0.0.9",
    "pypdf>=5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "sqlglot>=30,<31",
    "hijridate>=2.3",
    "regex>=2024.11",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = [
    "pytest>=8.2",
    "httpx2>=2.13",
    "testcontainers[postgres,mssql,mysql]>=4.15",
    "ruff>=0.6",
    "aiosmtpd>=1.4.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dawam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not oracle'"
pythonpath = ["."]
markers = [
    "oracle: needs an Oracle container (slow and heavy); run with `pytest -m oracle`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
