# Alembic CLI config. The app itself migrates on startup and does not read this file.
# Usage (in backend/, with DAWAM_DATABASE_URL set):
#   alembic upgrade head
#   alembic revision --autogenerate -m "add workspaces"
[alembic]
script_location = %(here)s/src/dawam/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
