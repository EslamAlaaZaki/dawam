# DAWAM with every component in one file, over plain HTTP (HTTPS disabled):
#   edge, web, app, worker, db        DAWAM itself
#   ollama + ollama-pull              local LLM server, with its models pulled on first start
#   mailpit                           SMTP server that catches every email (web UI :8025)
#   searxng                           web search for the assistant (http://searxng:8080)
#   source-db (profile "demo")        a small seeded PostgreSQL source to try Connections on
#   crawl4ai (profile "crawl4ai")     a browser for pages web fetch cannot read, locked down
#
# From the repository root:
#   cp .env.example .env              # set DAWAM_ENCRYPTION_KEY (and the first admin)
#   docker compose -f deploy/docker-compose.yaml --env-file .env up -d --build
#   docker compose -f deploy/docker-compose.yaml --env-file .env --profile demo up -d --build
# Use the same command (same -f and --env-file) every time. Relative paths below are
# relative to this file. deploy/README.md, "All-in-one Compose file", has the rest.

name: dawam

x-dawam: &dawam
  build:
    context: ..
    dockerfile: Dockerfile
  env_file:
    - path: ../.env
      required: true
  environment:
    DAWAM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dawam}:${POSTGRES_PASSWORD:-dawam}@db:5432/${POSTGRES_DB:-dawam}
    DAWAM_STORAGE_BACKEND: local
    DAWAM_STORAGE_PATH: /var/lib/dawam/files
    # Only `edge` may tell the app who the client is.
    DAWAM_FORWARDED_ALLOW_IPS: 172.30.126.10
    # HTTPS disabled: never send Strict-Transport-Security.
    DAWAM_HSTS_MAX_AGE_SECONDS: "0"
  volumes:
    - file-data:/var/lib/dawam/files
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  # --- DAWAM ---------------------------------------------------------------------

  edge:
    build: nginx
    environment:
      # HTTPS disabled: no TLS proxy is trusted, so every request is plain HTTP.
      DAWAM_TRUSTED_PROXY_CIDRS: ""
    ports:
      - "${DAWAM_PORT:-8000}:8080"
    networks:
      default:
        ipv4_address: 172.30.126.10
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ../frontend
    environment:
      DAWAM_HSTS_MAX_AGE_SECONDS: "0"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: unless-stopped

  app:
    <<: *dawam
    # crawl4ai-internal: the one way to reach Crawl4AI. Only `app` joins it: web fetch runs in
    # chat, never in a background job.
    networks:
      - default
      - crawl4ai-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  worker:
    <<: *dawam
    command: ["python", "-m", "dawam", "worker"]
    # Workers share the queue (FOR UPDATE SKIP LOCKED), so scale with
    # DAWAM_WORKERS=4 or `docker compose up --scale worker=4`.
    deploy:
      replicas: ${DAWAM_WORKERS:-2}

  db:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dawam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dawam}
      POSTGRES_DB: ${POSTGRES_DB:-dawam}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # --- Local LLM -----------------------------------------------------------------
  # Add it in Admin > Language models as an OpenAI-compatible provider at
  # http://ollama:11434/v1 (no API key), add its models, then assign them to the agent,
  # light and embedding roles in Admin > Roles, budgets & usage.

  ollama:
    image: ollama/ollama
    environment:
      # Ollama's default context is small and it truncates longer prompts silently.
      # Enter the same value as the model's context window in Admin > Language models.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: unless-stopped
    # NVIDIA GPU: uncomment (needs the NVIDIA Container Toolkit on the host).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Pulls OLLAMA_MODELS once and exits; models already pulled are skipped quickly.
  ollama-pull:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODELS_TO_PULL: ${OLLAMA_MODELS:-qwen2.5:7b nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'for m in $$OLLAMA_MODELS_TO_PULL; do echo "pulling $$m"; ollama pull "$$m" || exit 1; done'
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # --- Email ---------------------------------------------------------------------
  # Catches every email DAWAM sends; read them at http://localhost:8025. Set it in
  # Admin > Email: host mailpit, port 1025, no TLS, no login. For real delivery, enter
  # your own SMTP server there instead.

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  # --- Web search ----------------------------------------------------------------
  # The assistant's web_search. Add it in Admin > Web access as a SearXNG provider with
  # base URL http://searxng:8080 and pick it; it counts as internal, so internal-only
  # Workspaces can use it too. No host port: only DAWAM calls it.

  searxng:
    image: searxng/searxng:2026.10.17-1c10abe2d
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: unless-stopped

  # --- Browser for web fetch (profile "crawl4ai") --------------------------------
  # For pages web fetch cannot read (ADR 0008, #545). Set DAWAM_CRAWL4AI_URL and
  # DAWAM_CRAWL4AI_API_TOKEN in .env; deploy/README.md has the rest. A page's JavaScript runs
  # here, so it is on the internal network only, away from the database, SearXNG, Ollama and
  # the rest: its only way out is egress-filter. Update crawl4ai/config.yml with the image.

  crawl4ai:
    image: unclecode/crawl4ai:0.9.5@sha256:0b05666882bfb67f45d559a5b827839c54127b74aedd723f8ab338a3571b5fc9
    profiles: ["crawl4ai"]
    environment:
      # Empty: the server stays on its own loopback and DAWAM cannot reach it.
      CRAWL4AI_API_TOKEN: ${DAWAM_CRAWL4AI_API_TOKEN:-}
      # Crawl4AI's browser always goes through its own proxy, which refuses internal addresses
      # and asks this upstream for the address it checked.
      CRAWL4AI_UPSTREAM_PROXY: http://172.30.127.10:3128
    volumes:
      - ./crawl4ai/config.yml:/app/config.yml:ro
      - ./crawl4ai/resolv.conf:/etc/resolv.conf:ro
    networks:
      - crawl4ai-internal
    depends_on:
      - egress-filter
      - crawl4ai-dns
    user: appuser
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/redis:uid=999,gid=999,mode=0700
      - /var/lib/crawl4ai/outputs:uid=999,gid=999,mode=0700
      - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700
      - /home/appuser/.cache/url_seeder:uid=999,gid=999,mode=0700
      - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700
    shm_size: 1gb
    deploy:
      resources:
        limits:
          memory: 2g
          pids: 512
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  # What refuses internal addresses for crawl4ai; crawl4ai/squid.conf.
  egress-filter:
    # No stable channel is published for a supported Squid: _edge, frozen by the digest.
    image: ubuntu/squid:7.2-26.04_edge@sha256:74a4935c1329cde41522d2fbc8351101b9ac3be0b5129c49e1803ff6df589027
    profiles: ["crawl4ai"]
    # Squid itself: the image's service manager needs to write to the root file system.
    entrypoint: ["/usr/sbin/squid-gnutls", "-f", "/etc/squid/squid.conf", "-NYC", "-d", "1"]
    volumes:
      - ./crawl4ai/squid.conf:/etc/squid/squid.conf:ro
    networks:
      crawl4ai-internal:
        ipv4_address: 172.30.127.10
      crawl4ai-egress: {}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run:uid=584792,gid=584792,mode=0700
      - /var/log/squid:uid=584792,gid=584792,mode=0700
      - /var/spool/squid:uid=584792,gid=584792,mode=0700
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  # Resolves outside names for crawl4ai; crawl4ai/Corefile.
  crawl4ai-dns:
    image: coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
    profiles: ["crawl4ai"]
    volumes:
      - ./crawl4ai/Corefile:/Corefile:ro
    networks:
      crawl4ai-internal:
        ipv4_address: 172.30.127.11
      crawl4ai-egress: {}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    read_only: true
    deploy:
      resources:
        limits:
          memory: 64m
    restart: unless-stopped

  # --- Demo source database (profile "demo") ------------------------------------
  # A small shop in schema `sales`. Add a Connection: PostgreSQL, host source-db,
  # port 5432, database shop, user reader, password reader (read-only).

  source-db:
    image: postgres:16
    profiles: ["demo"]
    environment:
      POSTGRES_USER: source
      POSTGRES_PASSWORD: source
      POSTGRES_DB: shop
    volumes:
      - ../e2e/source-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - source-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source -d shop"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # If this clashes with a network on your host, change it, edge's ipv4_address
        # and DAWAM_FORWARDED_ALLOW_IPS together.
        - subnet: 172.30.126.0/24
          ip_range: 172.30.126.128/25
  # No route out: crawl4ai reaches only `app`, egress-filter and crawl4ai-dns. If this clashes
  # with a network on your host, change it together with the two fixed addresses above,
  # CRAWL4AI_UPSTREAM_PROXY, crawl4ai/resolv.conf and crawl4ai/squid.conf.
  crawl4ai-internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.127.0/24
          ip_range: 172.30.127.128/25
  # The way out, for egress-filter and crawl4ai-dns only.
  crawl4ai-egress: {}

volumes:
  db-data:
  file-data:
  ollama-data:
  source-data:
