# Crawl4AI's server settings, the image's deploy/docker/config.yml of v0.9.5 with these changes
# (the server reads this whole file, so every section stays; #545):
# - crawler.pool.max_pages: 2 (was 40), so a burst cannot exhaust the memory limit;
# - crawler.base_config: empty (was simulate_user: true), the default identity (ADR 0008);
# - crawler.browser.kwargs and extra_args: empty (were text_mode: true and flags), the full
#   browser, and the same settings a request sends, so one browser serves both. Chromium's
#   flags for running in a container are added by Crawl4AI itself.
# - llm and webhooks are not used by DAWAM; webhooks.enabled is false.
# Update this file with the image.
app:
  title: "Crawl4AI API"
  version: "1.0.0"
  # The address gunicorn binds comes from the image's entrypoint: every interface, because
  # CRAWL4AI_API_TOKEN is set. Without a token it stays on loopback and DAWAM cannot reach it.
  host: "127.0.0.1"
  port: 11235
  reload: False
  workers: 1
  timeout_keep_alive: 300

llm:
  provider: "openai/gpt-4o-mini"

redis:
  host: "localhost"
  port: 6379
  db: 0
  password: ""
  task_ttl_seconds: 3600
  ssl: False
  ssl_cert_reqs: None
  ssl_ca_certs: None
  ssl_certfile: None
  ssl_keyfile: None

limits:
  max_body_bytes: 10485760
  max_pages: 100
  max_depth: 5
  wall_clock_s: 300
  queue:
    maxsize: 1000
    workers: 4
    per_principal: 0

rate_limiting:
  enabled: True
  default_limit: "1000/minute"
  trusted_proxies: []
  storage_uri: "memory://"

security:
  enabled: true
  jwt_enabled: false
  api_token: ""
  https_redirect: false
  trusted_hosts: ["*"]
  cors_allow_origins: []
  headers:
    x_content_type_options: "nosniff"
    x_frame_options: "DENY"
    content_security_policy: "default-src 'self'"
    strict_transport_security: "max-age=63072000; includeSubDomains"

crawler:
  base_config: {}
  memory_threshold_percent: 95.0
  rate_limiter:
    enabled: true
    base_delay: [1.0, 2.0]
  timeouts:
    stream_init: 30.0
    batch_process: 300.0
  pool:
    max_pages: 2
    idle_ttl_sec: 300
    max_pages_before_recycle: 200
  browser:
    kwargs: {}
    extra_args: []

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

observability:
  prometheus:
    enabled: True
    endpoint: "/metrics"
  health_check:
    endpoint: "/health"

webhooks:
  enabled: false
  default_url: null
  data_in_payload: false
  retry:
    max_attempts: 5
    initial_delay_ms: 1000
    max_delay_ms: 32000
    timeout_ms: 30000
  headers:
    User-Agent: "Crawl4AI-Webhook/1.0"
