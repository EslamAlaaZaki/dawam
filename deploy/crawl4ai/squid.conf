# The egress filter: the only way off the crawl4ai network (ADR 0008, #545). The whole of Squid's
# configuration, mounted over the image's: the image's own conf.d turns on `allow localnet`, which
# would let this network reach every private address. There is no include, so the order is below.
#
# A browser runs whatever a page asks for, so every request is checked here. A redirect is a new
# request to this proxy, and `dst` checks the address itself, under whatever name it came, and
# refuses a host if ANY of its addresses is listed.
#
# DNS rebinding, two defences. Neither has been seen working until the by-hand check in
# deploy/README.md has run:
# 1. Crawl4AI's own proxy resolves a host once, and asks this filter for that IP address, so
#    nothing is left to resolve again.
# 2. A compromised browser could ask for a name directly. Squid's `dst` and its connection read
#    the same DNS cache, and negative_dns_ttl is also the lowest time any answer stays there
#    (Squid's documentation), whatever TTL the name's owner set. So within those 5 minutes the
#    check and the connection use one answer.

http_port 3128

# Private, loopback, link-local (cloud metadata), shared, reserved, multicast.
acl refused_address dst 0.0.0.0/8
acl refused_address dst 10.0.0.0/8
acl refused_address dst 100.64.0.0/10
acl refused_address dst 127.0.0.0/8
acl refused_address dst 169.254.0.0/16
acl refused_address dst 172.16.0.0/12
acl refused_address dst 192.0.0.0/24
acl refused_address dst 192.0.2.0/24
acl refused_address dst 192.88.99.0/24
acl refused_address dst 192.168.0.0/16
acl refused_address dst 198.18.0.0/15
acl refused_address dst 198.51.100.0/24
acl refused_address dst 203.0.113.0/24
acl refused_address dst 224.0.0.0/4
acl refused_address dst 240.0.0.0/4
# IPv6, with the ranges that embed an IPv4 address (NAT64, 6to4, Teredo, IPv4-compatible).
# IPv4-mapped (::ffff:0:0/96) must not be listed: Squid holds every IPv4 address in that form,
# so the entry would refuse them all. A mapped address is checked against the IPv4 lines above.
acl refused_address dst ::/96
acl refused_address dst 64:ff9b::/96
acl refused_address dst 64:ff9b:1::/48
acl refused_address dst 100::/64
acl refused_address dst 2001::/23
acl refused_address dst 2001:db8::/32
acl refused_address dst 2002::/16
acl refused_address dst fc00::/7
acl refused_address dst fe80::/10
acl refused_address dst fec0::/10
acl refused_address dst ff00::/8

acl crawl4ai_network src 172.30.127.0/24
acl web_port port 80 443
acl tls_port port 443

http_access deny manager
http_access deny !crawl4ai_network
http_access deny refused_address
http_access deny !web_port
http_access deny CONNECT !tls_port
http_access allow crawl4ai_network
http_access deny all

# See the top: the lowest and the highest time an answer stays are the same.
negative_dns_ttl 5 minutes
positive_dns_ttl 5 minutes
hosts_file none

# A filter, not a cache, and it says nothing about what sits behind it.
cache deny all
cache_mem 8 MB
via off
forwarded_for delete
httpd_suppress_version_string on

# The image's user, without privileges; the paths below are tmpfs in the Compose files, and the
# rest of the file system is read-only.
cache_effective_user _daemon_
access_log none
cache_log /var/log/squid/cache.log
logfile_rotate 0
pid_filename /run/squid.pid
coredump_dir /tmp
pinger_enable off
max_filedescriptors 1024
