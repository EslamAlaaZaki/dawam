# The egress filter: the only way off the crawl4ai network (ADR 0008, #545). Squid, as a
# snippet of the image's own squid.conf, which includes it before its `http_access deny all`.
# A browser runs whatever a page asks for, so every request is checked here: a redirect is a
# new request to this proxy, and `dst` checks the address itself, whatever name it came under.
# Crawl4AI's own proxy already resolves each host once and asks for its IP address, so a second
# DNS answer cannot swap in another (rebinding). This filter does not trust that: a host name
# is resolved here too, `dst` refuses it if ANY of its addresses is listed, and
# negative_dns_ttl below holds every answer long enough that the check and the connection use
# the same one.

# Private, loopback, link-local (cloud metadata), shared, reserved, multicast.
acl refused_address dst 0.0.0.0/8
acl refused_address dst 10.0.0.0/8
acl refused_address dst 100.64.0.0/10
acl refused_address dst 127.0.0.0/8
acl refused_address dst 169.254.0.0/16
acl refused_address dst 172.16.0.0/12
acl refused_address dst 192.0.0.0/24
acl refused_address dst 192.0.2.0/24
acl refused_address dst 192.88.99.0/24
acl refused_address dst 192.168.0.0/16
acl refused_address dst 198.18.0.0/15
acl refused_address dst 198.51.100.0/24
acl refused_address dst 203.0.113.0/24
acl refused_address dst 224.0.0.0/4
acl refused_address dst 240.0.0.0/4
# IPv6, with the ranges that embed an IPv4 address (NAT64, 6to4, Teredo, IPv4-compatible).
# IPv4-mapped (::ffff:0:0/96) must not be listed: Squid holds every IPv4 address in that form,
# so the entry would refuse them all. A mapped address is checked against the IPv4 lines above.
acl refused_address dst ::/96
acl refused_address dst 64:ff9b::/96
acl refused_address dst 64:ff9b:1::/48
acl refused_address dst 100::/64
acl refused_address dst 2001::/23
acl refused_address dst 2001:db8::/32
acl refused_address dst 2002::/16
acl refused_address dst fc00::/7
acl refused_address dst fe80::/10
acl refused_address dst fec0::/10
acl refused_address dst ff00::/8

acl crawl4ai_network src 172.30.127.0/24
acl web_port port 80 443

http_access deny !crawl4ai_network
http_access deny refused_address
http_access deny !web_port
http_access deny CONNECT !SSL_ports
http_access allow crawl4ai_network

# Every DNS answer stays at least this long, so a host cannot answer "public" to the check
# and "private" to the connection a moment later.
negative_dns_ttl 5 minutes
positive_dns_ttl 5 minutes
hosts_file none

# A filter, not a cache, and it says nothing about what sits behind it.
cache deny all
cache_mem 8 MB
via off
forwarded_for delete
httpd_suppress_version_string on
access_log none
max_filedescriptors 4096
