# DAWAM's entry point when it runs without Docker (deploy/README.md, methods 4 and 5):
# the same routing as the `edge` image (deploy/nginx/).
#   app: python -m dawam serve --host 127.0.0.1 --port 8000
#   web: node server.js   (HOSTNAME=127.0.0.1 PORT=3000)
# Include it from nginx.conf's http block, or copy it to conf.d/ / sites-enabled/.
# Set DAWAM_PUBLIC_URL to the address users open (http://localhost:8080 as written).

server {
    # Your machine only. On a server others reach, use e.g. `listen 80;` instead.
    listen 127.0.0.1:8080;
    server_name _;
    server_tokens off;

    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    # Overwritten, never appended: the app trusts these from 127.0.0.1 only
    # (DAWAM_FORWARDED_ALLOW_IPS defaults to 127.0.0.1).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location = /api     { proxy_pass http://127.0.0.1:8000; }
    location = /healthz { proxy_pass http://127.0.0.1:8000; }
    location = /readyz  { proxy_pass http://127.0.0.1:8000; }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
