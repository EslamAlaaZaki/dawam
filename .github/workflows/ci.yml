name: CI

# PR branches are tested once, by `pull_request`; `push` covers main and the AI feature branches.
on:
  push:
    branches: [main, "feature/ai-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite is split round-robin over 4 runners (`--shard`, tests/conftest.py); each
  # starts its own containers.
  backend:
    name: Backend lint + tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (pytest, PostgreSQL 16 and SQL Server 2022 via Testcontainers)
        run: pytest --shard ${{ matrix.shard }}/4

  # Oracle containers are slow and heavy: their tests (marker `oracle`) run here, not above.
  backend-oracle:
    name: Backend Oracle connector tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Tests (pytest -m oracle, Oracle Free via Testcontainers)
        run: pytest -m oracle

  boundaries:
    name: Module-boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/check_boundaries.py src
        working-directory: backend

  frontend:
    name: Frontend lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Component tests (Vitest + Testing Library)
        run: npm test
      - name: Build (next build, also type-checks)
        run: npm run build

  edge:
    name: Edge proxy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t dawam-edge deploy/nginx
      # `nginx -T` prints every file it loaded: fail unless DAWAM's server is among them.
      - name: Config is valid without a trusted proxy
        run: docker run --rm dawam-edge nginx -T 2>&1 | tee /dev/stderr | grep -q "location /api/"
      - name: Config is valid with trusted proxies
        run: |
          docker run --rm -e DAWAM_TRUSTED_PROXY_CIDRS="10.0.0.0/8, 192.0.2.7" dawam-edge nginx -T 2>&1 \
            | tee /dev/stderr | grep -q "set_real_ip_from 192.0.2.7;"

  api-client:
    name: API client is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e backend
      - run: npm ci
        working-directory: frontend
      - run: scripts/check-api-client.sh

  # The main path in a real browser against the whole Compose stack, with the fake LLM
  # provider and a seeded PostgreSQL source (compose.e2e.yaml, e2e/README.md).
  e2e:
    name: End-to-end smoke test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: compose.yaml:compose.e2e.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start the stack
        run: |
          key="$(openssl rand -base64 32 | tr '+/' '-_')"
          echo "DAWAM_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
          DAWAM_ENCRYPTION_KEY="$key" docker compose up --build --wait --wait-timeout 600
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Playwright
        run: npx playwright test
        working-directory: e2e
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 300
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
      - if: always()
        run: docker compose down --volumes
