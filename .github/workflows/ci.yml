name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (pytest, PostgreSQL 16 via Testcontainers)
        run: pytest

  # Oracle containers are slow and heavy: their tests (marker `oracle`) run here, not above.
  backend-oracle:
    name: Backend Oracle connector tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Tests (pytest -m oracle, Oracle Free via Testcontainers)
        run: pytest -m oracle

  boundaries:
    name: Module-boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/check_boundaries.py src
        working-directory: backend

  frontend:
    name: Frontend lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Component tests (Vitest + Testing Library)
        run: npm test
      - name: Build (next build, also type-checks)
        run: npm run build

  edge:
    name: Edge proxy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t dawam-edge deploy/nginx
      # `nginx -T` prints every file it loaded: fail unless DAWAM's server is among them.
      - name: Config is valid without a trusted proxy
        run: docker run --rm dawam-edge nginx -T 2>&1 | tee /dev/stderr | grep -q "location /api/"
      - name: Config is valid with trusted proxies
        run: |
          docker run --rm -e DAWAM_TRUSTED_PROXY_CIDRS="10.0.0.0/8, 192.0.2.7" dawam-edge nginx -T 2>&1 \
            | tee /dev/stderr | grep -q "set_real_ip_from 192.0.2.7;"

  api-client:
    name: API client is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e backend
      - run: npm ci
        working-directory: frontend
      - run: scripts/check-api-client.sh
