# DAWAM: `cp .env.example .env` (optional), then `docker compose up --build`.
# DAWAM listens on http://localhost:${DAWAM_PORT:-8000}: the `web` service, which
# serves the UI and forwards /api, /healthz and /readyz to `app`. Only `web` is
# published; `app`, `worker` and `db` are reachable inside the Compose network only.
# Optional local LLM server: `docker compose --profile ollama up`.

name: dawam

x-dawam: &dawam
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DAWAM_DATABASE_URL: ${DAWAM_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-dawam}:${POSTGRES_PASSWORD:-dawam}@db:5432/${POSTGRES_DB:-dawam}}
    # Required, no default: compose refuses to start without it.
    DAWAM_ENCRYPTION_KEY: ${DAWAM_ENCRYPTION_KEY:?set DAWAM_ENCRYPTION_KEY in .env; .env.example says how to generate one}
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dawam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dawam}
      POSTGRES_DB: ${POSTGRES_DB:-dawam}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    <<: *dawam
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  worker:
    <<: *dawam
    command: ["python", "-m", "dawam", "worker"]

  web:
    build:
      context: frontend
      args:
        # Baked into the build: change it, then `docker compose up --build`.
        DAWAM_API_URL: ${DAWAM_API_URL:-http://app:8000}
    # Only what the web server needs; it holds no secrets.
    environment:
      DAWAM_HSTS_MAX_AGE_SECONDS: ${DAWAM_HSTS_MAX_AGE_SECONDS:-31536000}
    ports:
      - "${DAWAM_PORT:-8000}:3000"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  db-data:
  ollama-data:
