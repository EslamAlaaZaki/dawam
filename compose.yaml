# DAWAM: `cp .env.example .env` (optional), then `docker compose up --build`.
# DAWAM listens on http://localhost:${DAWAM_PORT:-8000}: the `edge` proxy, which sends
# /api/, /healthz and /readyz to `app` and everything else to `web`. Only `edge` is
# published; the other services are reachable inside the Compose network only.
# Optional local LLM server: `docker compose --profile ollama up`. `searxng` serves the
# assistant's web search (see deploy/README.md). Optional browser for pages web fetch cannot
# read: `docker compose --profile crawl4ai up` (see deploy/README.md).

name: dawam

x-dawam: &dawam
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DAWAM_DATABASE_URL: ${DAWAM_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-dawam}:${POSTGRES_PASSWORD:-dawam}@db:5432/${POSTGRES_DB:-dawam}}
    # Required, no default: compose refuses to start without it.
    DAWAM_ENCRYPTION_KEY: ${DAWAM_ENCRYPTION_KEY:?set DAWAM_ENCRYPTION_KEY in .env; .env.example says how to generate one}
    # Only `edge` may tell the app who the client is and whether it used HTTPS.
    DAWAM_FORWARDED_ALLOW_IPS: 172.30.126.10
    DAWAM_STORAGE_PATH: ${DAWAM_STORAGE_PATH:-/var/lib/dawam/files}
  volumes:
    - file-data:/var/lib/dawam/files
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  edge:
    build: deploy/nginx
    environment:
      # A TLS-terminating proxy in front of DAWAM (see .env.example); unset: none.
      DAWAM_TRUSTED_PROXY_CIDRS: ${DAWAM_TRUSTED_PROXY_CIDRS:-}
    ports:
      - "${DAWAM_PORT:-8000}:8080"
    networks:
      default:
        # Fixed, so `app` can trust exactly this address (DAWAM_FORWARDED_ALLOW_IPS).
        ipv4_address: 172.30.126.10
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dawam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dawam}
      POSTGRES_DB: ${POSTGRES_DB:-dawam}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    <<: *dawam
    # crawl4ai-internal: the one way to reach Crawl4AI. Only `app` joins it: web fetch runs in
    # chat, never in a background job.
    networks:
      - default
      - crawl4ai-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  worker:
    <<: *dawam
    command: ["python", "-m", "dawam", "worker"]

  web:
    build: frontend
    # Only what the web server needs; it holds no secrets.
    environment:
      DAWAM_HSTS_MAX_AGE_SECONDS: ${DAWAM_HSTS_MAX_AGE_SECONDS:-31536000}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  # Web search for the assistant: in Admin > Web access, add a SearXNG provider with base
  # URL http://searxng:8080. No host port: only DAWAM calls it.
  searxng:
    image: searxng/searxng:2026.10.17-1c10abe2d
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: unless-stopped

  # A browser for pages web fetch cannot read (ADR 0008, #545). Set DAWAM_CRAWL4AI_URL and
  # DAWAM_CRAWL4AI_API_TOKEN in .env; deploy/README.md has the rest. A page's JavaScript runs
  # here, so it is on the internal network only, away from the database, SearXNG, Ollama and
  # the rest: its only way out is egress-filter. Update deploy/crawl4ai/config.yml with the image.
  crawl4ai:
    image: unclecode/crawl4ai:0.9.5@sha256:0b05666882bfb67f45d559a5b827839c54127b74aedd723f8ab338a3571b5fc9
    profiles: ["crawl4ai"]
    environment:
      # Empty: the server stays on its own loopback and DAWAM cannot reach it.
      CRAWL4AI_API_TOKEN: ${DAWAM_CRAWL4AI_API_TOKEN:-}
      # Crawl4AI's browser always goes through its own proxy, which refuses internal addresses
      # and asks this upstream for the address it checked.
      CRAWL4AI_UPSTREAM_PROXY: http://172.30.127.10:3128
    volumes:
      - ./deploy/crawl4ai/config.yml:/app/config.yml:ro
      - ./deploy/crawl4ai/resolv.conf:/etc/resolv.conf:ro
    networks:
      - crawl4ai-internal
    depends_on:
      - egress-filter
      - crawl4ai-dns
    user: appuser
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/redis:uid=999,gid=999,mode=0700
      - /var/lib/crawl4ai/outputs:uid=999,gid=999,mode=0700
      - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700
      - /home/appuser/.cache/url_seeder:uid=999,gid=999,mode=0700
      - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700
    shm_size: 1gb
    deploy:
      resources:
        limits:
          memory: 2g
          pids: 512
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  # What refuses internal addresses for crawl4ai; deploy/crawl4ai/egress-filter.conf.
  egress-filter:
    image: ubuntu/squid:7.2-26.04_edge@sha256:74a4935c1329cde41522d2fbc8351101b9ac3be0b5129c49e1803ff6df589027
    profiles: ["crawl4ai"]
    volumes:
      - ./deploy/crawl4ai/egress-filter.conf:/etc/squid/conf.d/egress-filter.conf:ro
    networks:
      crawl4ai-internal:
        ipv4_address: 172.30.127.10
      crawl4ai-egress: {}
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  # Resolves outside names for crawl4ai; deploy/crawl4ai/Corefile.
  crawl4ai-dns:
    image: coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
    profiles: ["crawl4ai"]
    volumes:
      - ./deploy/crawl4ai/Corefile:/Corefile:ro
    networks:
      crawl4ai-internal:
        ipv4_address: 172.30.127.11
      crawl4ai-egress: {}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    read_only: true
    deploy:
      resources:
        limits:
          memory: 64m
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # If this clashes with a network on your host, change it, edge's ipv4_address
        # and DAWAM_FORWARDED_ALLOW_IPS together. Other containers get addresses from
        # ip_range only, so edge's fixed address is never taken.
        - subnet: 172.30.126.0/24
          ip_range: 172.30.126.128/25
  # No route out: crawl4ai reaches only `app`, egress-filter and crawl4ai-dns. If this clashes
  # with a network on your host, change it together with the two fixed addresses above,
  # CRAWL4AI_UPSTREAM_PROXY, deploy/crawl4ai/resolv.conf and egress-filter.conf.
  crawl4ai-internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.127.0/24
          ip_range: 172.30.127.128/25
  # The way out, for egress-filter and crawl4ai-dns only.
  crawl4ai-egress: {}

volumes:
  db-data:
  file-data:
  ollama-data:
